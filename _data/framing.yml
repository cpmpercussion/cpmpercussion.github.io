# Canonical benefit statement for the site, in three lengths (see GitHub issue #36).
# Edit here, not in the pages: the hero, bio, JSON-LD and llms.txt all read from this file.
# Guardrail: every sentence in the long form should survive "what's the evidence for that?"
# Figures marked with a date need to be refreshed manually.

one_line: >-
  Charles Martin builds intelligent musical instruments and open-source AI tools
  that let musicians, students and researchers work with AI in live, creative
  settings, and leads the Australian node of Norway's MishMash Centre for AI and Creativity.

short: >-
  I build musical instruments and open-source software that let people play
  music with AI in real time. My work shows how humans and AI systems can
  collaborate under the fast, high-stakes conditions of live performance, and
  turns those lessons into tools used by musicians, students and other
  researchers. I lead the Sound, Music and Creative Computing Lab at the ANU.

long:
  problem: >-
    Most AI systems are built for tasks where a person types a request and waits
    for an answer. Live music is different: a performer and a machine have to act
    together, continuously, in front of an audience, with no time to review the
    output. Understanding how people can trust, direct and share creative
    ownership with an AI system under these conditions is an open problem, that 
    we are only beginning to meet in everyday computing.
  beneficiaries: >-
    Performing musicians and composers who want AI as a collaborator rather than
    a replacement. Students learning to build creative software. Robotics and
    embodied-AI researchers who need methods for machines that act and adapt in
    the physical world. Through the MishMash Centre for AI and Creativity, where
    I lead the Australian node, the work reaches the sectors that centre serves:
    the creative industries, cultural heritage institutions, schools and lifelong
    learning, and arts-based health and well-being. In Australia, the music
    technology and creative industries sector benefits through the events,
    courses and open tools this work produces.
  change: >-
    The lab's platform, IMPSY, is a free, open-source system that turns any
    musical interface into a predictive instrument that learns from its player.
    It is used in our own recordings, performances and teaching, and is openly
    available for others to build on. Its approach comes from EPEC (Engineering
    Predictability with Embodied Cognition), a Research Council of Norway
    project at the University of Oslo where I was a postdoctoral fellow from
    2016 to 2019. EPEC built systems that sense, learn and predict future
    events in two settings: musical smartphone apps, which became my
    predictive-instrument line, and adaptive robots, where the DyRET quadruped
    learned to change its body and gait on real terrain, published in Nature
    Machine Intelligence. The models differ, but the problem is the same:
    prediction and adaptation for real-time action in the physical world. That
    heritage is why I am now the Australian node of MishMash, Norway's A$25M
    national Centre for AI and Creativity, bringing more than 200 researchers
    and 30 cultural organisations into reach of my lab. At home, the Sound and
    Music Computing course I started at the ANU has grown from 7 students in
    2019 to 180 in 2025, and hosting NIME 2025 brought the field's flagship
    international conference to Canberra for the first time.
  evidence:
    - "Google Scholar: 1,246 citations, h-index 16, with 83% of citations since 2021 (retrieved 2026-09-10)."
    - "Postdoctoral fellow on EPEC (Engineering Predictability with Embodied Cognition), Research Council of Norway grant 240862, University of Oslo, 2016 to 2019."
    - "Nature Machine Intelligence (2021) and Evolutionary Computation (2021) papers on real-world robot morphology adaptation from EPEC, the most cited work on my Scholar profile."
    - "IMPSY: open-source intelligent instrument platform, 12 releases since 2019; companion keras-mdn-layer library, 171 GitHub stars and 43 forks (retrieved 2026-09-10)."
    - "General Chair, NIME 2025 at the ANU: 96 accepted papers, 44 musical works, 149 in-person and about 50 remote attendees."
    - "Lead of the ANU node of MishMash, the Norwegian Centre for AI and Creativity (A$25M, from 2026): 200+ researchers, 22 Norwegian universities and research institutes, 30+ cultural organisations, with ANU the only Australian partner."
    - "Sound and Music Computing course at the ANU grown from 7 students (2019) to 180 (2025); co-led the Human Centred and Creative Computing major."
    - "Four PhD completions or submissions supervised, plus 30+ Honours and Master students."
